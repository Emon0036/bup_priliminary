[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gridwise"
version = "0.1.0"
description = "GridWise - Smart Campus Energy Optimization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "scipy>=1.13,<2",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
gridwise-optimize = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "gridwise"
addopts = "-v"